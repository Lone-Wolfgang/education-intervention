name: Deploy EDA, Modeling, and Interpretation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        run: |
          install.packages(c(
            "tidyverse", "GGally", "gt", "scales", "pROC",
            "patchwork", "broom", "rmarkdown", "knitr", "ggthemes",
            "glmnet", "randomForest", "xgboost", "rpart", "car"
          ))
        shell: Rscript {0}

      - name: Prepare site directory
        run: |
          mkdir -p site_src
          cp EDA.Rmd site_src/index.Rmd
          cp Modeling.Rmd site_src/Modeling.Rmd
          cp Interpretation.Rmd site_src/Interpretation.Rmd
          cp -r R site_src/R
          cp StudentPerformanceFactors.csv site_src/StudentPerformanceFactors.csv
          cat > site_src/_site.yml << 'EOF'
          name: "student-performance-report"
          output_dir: "_site"
          navbar:
            title: "Student Performance Factors"
            left:
              - text: "EDA"
                href: index.html
              - text: "Modeling"
                href: Modeling.html
              - text: "Interpretation"
                href: Interpretation.html
          EOF

      - name: Render site (EDA, Modeling, and Interpretation tabs)
        working-directory: site_src
        run: rmarkdown::render_site()
        shell: Rscript {0}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site_src/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
